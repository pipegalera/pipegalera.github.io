# Build the site with a pinned Zola version and publish it to the gh-pages branch.
# Uses only GitHub's own actions, because the repo only allows actions from GitHub,
# from pipegalera, or shalzz/zola-deploy-action@master.
name: Build and deploy GH Pages
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  ZOLA_VERSION: 0.21.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sudo tar xz -C /usr/local/bin
          zola --version

      - name: build
        run: zola build

      - name: deploy to gh-pages
        run: |
          cd public
          echo "pipegalera.com" > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA} to gh-pages"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
