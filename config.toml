# Config: https://not-matthias.github.io/apollo/posts/configuration/

base_url = "https://pipegalera.tech"
title = "~/.pipe_galera"
description = "Personal website of Pipe Galera"
build_search_index = true
generate_feeds = true
compile_sass = true
minify_html = true
taxonomies = [{ name = "tags" }]

# https://www.getzola.org/documentation/getting-started/configuration/
[markdown]
highlight_theme = "solarized-dark"
highlight_code = true

[extra]
analytics = false
use_cdn = false
dynamic_note = false
favicon = "icons/favicons/favicon-32x32.png"

toc = true
copy_code = true
mathjax = true
mathjax_dollar_inline_enable = true

menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    # { name = "/projects", url = "/projects", weight = 2 },
    { name = "/mostly_books", url = "/mostly_books", weight = 3 },
    # { name = "/about", url = "/about", weight = 4 },
    { name = "/tags", url = "/tags", weight = 4 },
]

socials = [
    { name = "linkedin", url = "https://www.linkedin.com/in/pipegalera/", icon = "linkedin" },
    { name = "github", url = "https://github.com/pipegalera/", icon = "github" },
]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"
