<header>
    <div class="main">
        {% if config.extra.logo %}
            <a href={{ config.base_url }} class="logo">
                <img alt="{{ config.title }}" src="{{ get_url(path=config.extra.logo) }}">
            </a>
        {% else %}
            <a href={{ config.base_url }}>{{ config.title }}</a>
        {% endif %}


        <div class="socials">
            {% for social in config.extra.socials %}
                <a rel="me" href="{{ social.url }}" class="social">
                    <img alt="{{ social.name }}"
                         src="{{ get_url(path="icons/social/" ~ social.icon ~ ".svg") }}">
                </a>
            {% endfor %}
        </div>
    </div>

    <nav>
        {% for menu in config.extra.menu %}
            <a href={{ get_url(path=menu.url) }} style="margin-left: 0.25em">{{ menu.name }}</a>
        {% endfor %}

        {% if config.build_search_index %}
            <button id="search-button"
                    class="search-button"
                    title="$SHORTCUT to open search">
                <img src="{{ get_url(path='icons/search.svg') }}"
                     alt="Search"
                     class="search-icon">
            </button>

            <div id="searchModal"
                 class="search-modal js"
                 role="dialog"
                 aria-labelledby="modalTitle">
                <div id="modal-content">
                    <h1 id="modalTitle" class="page-header">Search</h1>
                    <div id="searchBar">
                        <input id="searchInput"
                               role="combobox"
                               autocomplete="off"
                               spellcheck="false"
                               aria-expanded="false"
                               aria-controls="results-container"
                               placeholder="Search..." />
                        <button id="clear-search" class="clear-button" title="Clear search">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                                <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                            </svg>
                        </button>
                    </div>
                    <div id="results-container">
                        <div id="results-info">
                            <span id="zero_results" style="display: none;">No results</span>
                            <span id="one_result" style="display: none;">1 result</span>
                            <span id="many_results" style="display: none;">$NUMBER results</span>
                        </div>
                        <div id="results" role="listbox"></div>
                    </div>
                </div>
            </div>
        {% endif %}

        <button id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Dark mode"
                aria-pressed="false"
                title="Switch to dark theme"
                hidden>
            {# Feather icons, drawn in the text color. Moon in light mode, sun in dark mode. #}
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
        </button>
    </nav>
</header>
